<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLify</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <header>
      <div class="brand"><img src="../assets/solana.svg" alt="" width="25" height="20"><h1>SOLify<span class="dot">.</span></h1></div>
      <div class="header-right">
        <span class="badge">THE SOL LENS</span>
        <a id="github-link" class="github-link" href="https://github.com/ztxv/usd-to-sol-converter-extension" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" title="GitHub repository">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        </a>
      </div>
    </header>
    <p class="tagline">Same internet. Different denomination.</p>
    <section class="market" aria-label="SOL market price">
      <div class="market-top"><span class="coin"><span class="coin-icon"><img src="../assets/solana.svg" width="19" height="15" alt=""></span><span>SOL <small>/ USD</small></span></span><span class="live">● MARKET PRICE</span></div>
      <div id="price" class="price">—</div>
      <div class="market-bottom"><span id="updated">Fetching market price…</span><button id="refresh" class="refresh" aria-label="Refresh SOL price" title="Refresh SOL price">↻ <span>Refresh</span></button></div>
    </section>
    <p id="rate-error" class="notice" role="status" hidden></p>
    <section class="controls" aria-label="Preferences">
      <label class="toggle-row"><span><strong>Conversion</strong><small id="conversion-note">SOLify the web.</small></span><input id="enabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <div class="divider"></div>
      <div class="select-row"><label for="display">Display</label><select id="display"><option value="logo">Logo</option><option value="clean">Clean</option><option value="ticker">Ticker</option></select></div>
      <div class="select-row"><label for="precision">Precision</label><select id="precision"><option value="meme">Meme</option><option value="normal">Normal</option><option value="autistic">Autistic</option></select></div>
      <div class="preview"><span>PREVIEW</span><output id="preview"><img src="../assets/solana.svg" alt="" width="14" height="11"> 1.002 SOL</output></div>
      <label class="toggle-row hover-row"><span>Original on hover</span><input id="hover" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label>
    </section>
    <section class="site-section" aria-label="Current site"><label class="toggle-row"><span class="site-copy"><strong id="site">Current site</strong><small id="site-note">Allow conversion on this site</small></span><input id="site-enabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label></section>
    <button id="restore" class="restore">↶ <span>Restore USD on this page</span></button>
    <p id="status" class="notice" role="status" hidden></p>
    <footer><span class="privacy-dot"></span> No wallets. No tracking. Just SOL.</footer>
  </main>
  <script src="../utils/settings.js"></script><script src="../utils/formatting.js"></script><script src="popup.js"></script>
</body>
</html>
